name: release-tag

# Checks every pushed v* tag against the tagged files: the tag must equal `v` plus
# the root package.json version, every workspace package must carry that version,
# and CHANGELOG.md must have the tag's section. Tags are cut locally with
# `pnpm release` (see CONTRIBUTING.md); this workflow never creates or pushes one.
# The tag name reaches the script only through the runner's environment.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node from .nvmrc: the check is TypeScript run by Node's type stripping.
      # Nothing is installed, so there is no package cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check tag, versions and changelog
        run: node scripts/release-check.ts "$GITHUB_REF_NAME"

# Git hooks (D-16). Installed by lefthook's postinstall and by `pnpm lefthook install`.
pre-commit:
  commands:
    biome:
      glob: '*.{js,ts,json,jsonc}'
      run: pnpm biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

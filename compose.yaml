# Sift stack: db -> setup (one-shot) -> worker.
#
# Before the first `docker compose up -d`, copy the three example files:
#   .env.example                -> .env             (database passwords)
#   .env.mailboxes.example      -> .env.mailboxes   (mailbox IMAP passwords)
#   config/config.example.yaml  -> config/config.yaml
#
# Each service receives only the secrets it needs: the worker connects as
# sift_app and reads mailbox passwords; setup holds the owner and backup
# credentials but never a mailbox password.
#
# No top-level `name:` and no healthcheck `start_interval`: the dev machine
# runs Docker Compose v2.2.3.
#
# Before the first `docker compose up`, create the Bridge volume once:
#   docker volume create sift-bridge
# Compose v2.2.3 fails every command, for every service, while an external
# volume is missing.
#
# SIFT_BRIDGE_PORT moves Bridge's published host port, for example when the
# desktop Proton Mail Bridge app already holds 127.0.0.1:1143.
#
# SIFT_IMAGE, SIFT_CONFIG_HOST_DIR, SIFT_MAILBOXES_ENV_FILE, SIFT_BACKUP_HOST_DIR
# and SIFT_PGDATA_VOLUME exist only so scripts/compose-smoke.sh can run a
# throwaway stack that shares none of your files, image or volume. Likewise
# SIFT_BRIDGE_IMAGE and SIFT_BRIDGE_VOLUME exist only for the smoke scripts.
# Leave them unset.

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SIFT_DB_OWNER_PASSWORD: ${SIFT_DB_OWNER_PASSWORD:?set in .env}
      SIFT_DB_BACKUP_PASSWORD: ${SIFT_DB_BACKUP_PASSWORD:?set in .env}
    volumes:
      # PG18 images keep PGDATA under /var/lib/postgresql/18/docker; mount the
      # parent, not .../data, or the data lands in an anonymous volume.
      - sift-pgdata:/var/lib/postgresql
      - ./db/bootstrap.sql:/docker-entrypoint-initdb.d/10-sift-bootstrap.sql:ro
    healthcheck:
      # TCP, not the unix socket: the temporary initdb server listens on no
      # TCP address, so it never reads as healthy while bootstrap runs.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sift"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      # Loopback only. Never publish Postgres on all interfaces.
      - "127.0.0.1:${SIFT_DB_PORT:-5432}:5432"
    restart: unless-stopped

  # `sift setup`: config check, migrate (with a pg_dump backup first), config
  # apply. Rerun after editing config/config.yaml: docker compose run --rm setup
  setup:
    build:
      context: .
      args:
        NODE_VERSION: "${NODE_VERSION:-26.10.0}"
    image: ${SIFT_IMAGE:-sift:local}
    init: true
    command: ["sift", "setup"]
    environment:
      SIFT_OWNER_DATABASE_URL: postgres://sift_owner:${SIFT_DB_OWNER_PASSWORD:?set in .env}@db:5432/sift
      SIFT_BACKUP_DATABASE_URL: postgres://sift_backup:${SIFT_DB_BACKUP_PASSWORD:?set in .env}@db:5432/sift
      SIFT_DB_APP_PASSWORD: ${SIFT_DB_APP_PASSWORD:?set in .env}
      SIFT_CONFIG: /config/config.yaml
      SIFT_BACKUP_DIR: /backups
    volumes:
      - ${SIFT_CONFIG_HOST_DIR:-./config}:/config:ro
      # Must be writable by uid 1000 (the image's node user).
      # SIFT_BACKUP_HOST_DIR exists only so scripts/compose-smoke.sh keeps its
      # throwaway dumps out of your ./backups; leave it unset.
      - ${SIFT_BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: .
      args:
        NODE_VERSION: "${NODE_VERSION:-26.10.0}"
    image: ${SIFT_IMAGE:-sift:local}
    init: true
    command: ["sift", "worker"]
    # Mailbox IMAP passwords only (one variable per password_env in config.yaml).
    env_file:
      - ${SIFT_MAILBOXES_ENV_FILE:-.env.mailboxes}
    environment:
      SIFT_DATABASE_URL: postgres://sift_app:${SIFT_DB_APP_PASSWORD:?set in .env}@db:5432/sift
      SIFT_CONFIG: /config/config.yaml
      SIFT_HEARTBEAT_FILE: /tmp/sift/heartbeat
    volumes:
      - ${SIFT_CONFIG_HOST_DIR:-./config}:/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    healthcheck:
      # Unhealthy when the heartbeat file is older than 120 s. Docker restarts
      # a container only when it exits, never because it is unhealthy, so the
      # worker exits by itself (code 75) after 3 missed heartbeats in a row,
      # logging which step failed, and `restart: unless-stopped` starts it again
      # (it also comes back after a Docker daemon restart or host reboot).
      # While the database is down this repeats until it is back.
      test:
        - CMD
        - node
        - -e
        - "const s=require('node:fs').statSync('/tmp/sift/heartbeat');process.exit(Date.now()-s.mtimeMs<120000?0:1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped

  # Proton Mail Bridge, built from source at a pinned release (bridge/Dockerfile).
  # The worker reaches it at bridge:1143 and does not wait for it: a Bridge
  # outage is a mailbox error, not a stack failure.
  bridge:
    build:
      context: ./bridge
    image: ${SIFT_BRIDGE_IMAGE:-sift-bridge:local}
    environment:
      # Unlocks the GPG key that protects Bridge's vault in the sift-bridge
      # volume. Only the Bridge services receive it.
      SIFT_BRIDGE_KEYCHAIN_PASSPHRASE: ${SIFT_BRIDGE_KEYCHAIN_PASSPHRASE:?set in .env}
    volumes:
      # The vault volume only. This service never sees .env.mailboxes or
      # config; the one-shot bridge-init service is the only one that does.
      - sift-bridge:/data
    ports:
      # Loopback only. Never publish Bridge on all interfaces.
      - "127.0.0.1:${SIFT_BRIDGE_PORT:-1143}:1143"
    healthcheck:
      # Probes the socat listener on the container IP, the address the
      # published port and other containers reach. `$$` keeps the substitution
      # for the container shell instead of Compose interpolation.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/$$(hostname -i | cut -d' ' -f1)/1143"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  sift-pgdata:
    # Your database. SIFT_PGDATA_VOLUME exists only so scripts/compose-smoke.sh
    # can run a throwaway stack on its own volume; leave it unset.
    name: ${SIFT_PGDATA_VOLUME:-sift-pgdata}
  sift-bridge:
    # Bridge's session vault. Create it once with `docker volume create
    # sift-bridge`. SIFT_BRIDGE_VOLUME exists only for the smoke scripts.
    name: ${SIFT_BRIDGE_VOLUME:-sift-bridge}
    external: true

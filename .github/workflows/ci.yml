name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    # Throwaway values for the ephemeral service container above; no production
    # credential is involved (threat T-01-20, accepted).
    env:
      CI: 'true'
      SIFT_DB_OWNER_PASSWORD: ci-owner-password
      SIFT_DB_APP_PASSWORD: ci-app-password
      SIFT_DB_BACKUP_PASSWORD: ci-backup-password
      SIFT_TEST_ADMIN_URL: postgres://postgres:ci-postgres-password@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads packageManager from package.json. Node 26 ships without corepack.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pg_dump/pg_restore must match the server major (18); the runner image
      # does not ship client 18, so take it from the PGDG apt repository.
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # Same superuser bootstrap as the Compose initdb hook: roles sift_owner and
      # sift_backup, database sift, extension vector in template1.
      - name: Bootstrap roles and extensions
        run: >-
          docker exec -i -e SIFT_DB_OWNER_PASSWORD -e SIFT_DB_BACKUP_PASSWORD
          ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U postgres -f - < db/bootstrap.sql

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Includes the catalog schema check and the isolation tests; DB tests
      # fail (never skip) when SIFT_TEST_ADMIN_URL is unusable.
      - name: Test
        run: pnpm test

  # Builds the image and runs the whole stack (db -> setup -> worker) the way
  # owners do. Fails when setup exits non-zero or the worker never turns healthy.
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compose smoke
        run: scripts/compose-smoke.sh --down
